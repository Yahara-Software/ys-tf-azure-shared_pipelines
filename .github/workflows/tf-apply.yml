# central-repo/.github/workflows/tf-apply.yml
name: "Terraform Apply"
on:
  workflow_call:
    inputs:
      env: { required: true, type: string }
      path: { required: true, type: string }
    secrets:
      GH_APP_ID:
        required: true
        description: "GitHub App ID for accessing Terraform modules from private repositories"
      GH_APP_PRIVATE_KEY:
        required: true
        description: "GitHub App private key for accessing Terraform modules from private repositories"

jobs:
  check-and-plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      
      - name: Configure Git to use token
        run: |
          git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
      
      - uses: hashicorp/setup-terraform@v3

      # 1. Functional Requirement: Fmt/Validate
      - name: Static Checks
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          cd ${{ inputs.path }}
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      # 2. Security Check (Policy Violation)
      - name: Run tfsec (Security Scan)
        uses: aquasecurity/tfsec-action@v1.0.0

      - name: Terraform Init & Plan
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          STATE_KEY="${{ github.event.repository.name }}.${{ inputs.env }}.tfstate"
          terraform -chdir=${{ inputs.path }} init -backend-config="key=$STATE_KEY"
          # 3. Functional Requirement: Save Plan Artifact
          terraform -chdir=${{ inputs.path }} plan -out=tfplan

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repositError: The ssh-private-key argument is empty. Maybe the secret has not been configured, or you are using a wrong secret name in your workflow file.ory.name }}-${{ inputs.env }}-plan
          path: ${{ inputs.path }}/tfplan

  apply:
    needs: check-and-plan
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.env }} # <--- APPROVAL GATE
    runs-on: ubuntu-latest
    concurrency: terraform-${{ github.event.repository.name }}-${{ inputs.env }} # PREVENT CONCURRENT RUNS
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      
      - name: Configure Git to use token
        run: |
          git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
      
      - uses: hashicorp/setup-terraform@v3
      
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ inputs.env }}-plan
          path: ${{ inputs.path }}

      - name: Terraform Apply
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          STATE_KEY="${{ github.event.repository.name }}.${{ inputs.env }}.tfstate"
          terraform -chdir=${{ inputs.path }} init -backend-config="key=$STATE_KEY"
          terraform -chdir=${{ inputs.path }} apply -auto-approve tfplan

      # 4. Functional Requirement: Automated Testing
      - name: Run Terratest
        run: |
          cd test && go test -v -timeout 15m
