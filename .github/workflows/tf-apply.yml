# central-repo/.github/workflows/tf-apply.yml
name: "Terraform Apply"
on:
  workflow_call:
    inputs:
      env: { required: true, type: string }
      path: { required: true, type: string }
      #runner: { required: false, type: string, default: "ubuntu-latest" }
    secrets:
      GH_APP_ID:
        required: true
        description: "GitHub App ID for accessing Terraform modules from private repositories"
      GH_APP_PRIVATE_KEY:
        required: true
        description: "GitHub App private key for accessing Terraform modules from private repositories"
      AZURE_CLIENT_ID:
        required: true
        description: "Azure Client ID for OIDC authentication"
      AZURE_TENANT_ID:
        required: true
        description: "Azure Tenant ID"
      AZURE_SUBSCRIPTION_ID:
        required: true
        description: "Azure Subscription ID"

jobs:
  check-and-plan:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: >
            ys-tf-azure-service_plan,
            ys-tf-azure-linux_web_app,
            ys-tf-azure-resource_group,
            ys-tf-azure-acr,
            ys-tf-azure-virtual_network,
            ys-tf-azure-security_group,
            ys-tf-azure-public_ip,
            ys-tf-azure-virtual_machine,
            ys-tf-azure-app_gateway,
            ys-tf-azure-mssql_server,
            ys-tf-azure-mssql_database,
            ys-tf-azure-storage_account,
            ys-tf-azure-key_vault,
            ys-tf-azure-frontdoor,
            ys-tf-azure-app_insights,
            ys-tf-azure-alert_rules,
            ys-tf-azure-action_groups
      
      - name: Configure Git to use token
        run: |
          git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
      
      - uses: hashicorp/setup-terraform@v3

      # 1. Functional Requirement: Fmt/Validate
      - name: Static Checks
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          cd ${{ inputs.path }}
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      # 2. Security Check (Policy Violation)
      - name: Run tfsec (Security Scan)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ${{ inputs.path }}
          soft_fail: true

      - name: Terraform Init & Plan
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          terraform -chdir=${{ inputs.path }} init 
          # 3. Functional Requirement: Save Plan Artifact
          terraform -chdir=${{ inputs.path }} plan -out=tfplan

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ inputs.env }}-plan
          path: ${{ inputs.path }}/tfplan

  apply:
    needs: check-and-plan
    environment: ${{ inputs.env }} # <--- APPROVAL GATE (controls when apply runs)
    runs-on: ${{ inputs.runner }}
    concurrency: terraform-${{ github.event.repository.name }}-${{ inputs.env }} # PREVENT CONCURRENT RUNS
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: >
            ys-tf-azure-service_plan,
            ys-tf-azure-linux_web_app,
            ys-tf-azure-resource_group,
            ys-tf-azure-acr,
            ys-tf-azure-virtual_network,
            ys-tf-azure-security_group,
            ys-tf-azure-public_ip,
            ys-tf-azure-virtual_machine,
            ys-tf-azure-app_gateway,
            ys-tf-azure-mssql_server,
            ys-tf-azure-mssql_database,
            ys-tf-azure-storage_account,
            ys-tf-azure-key_vault,
            ys-tf-azure-frontdoor,
            ys-tf-azure-app_insights,
            ys-tf-azure-alert_rules,
            ys-tf-azure-action_groups
      
      - name: Configure Git to use token
        run: |
          git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
      
      - uses: hashicorp/setup-terraform@v3
      
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ inputs.env }}-plan
          path: ${{ inputs.path }}

      - name: Terraform Apply
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          terraform -chdir=${{ inputs.path }} init
          terraform -chdir=${{ inputs.path }} apply -auto-approve tfplan

      # 4. Functional Requirement: Automated Testing
      - name: Run Terratest
        run: |
          cd test && go test -v -timeout 15m
